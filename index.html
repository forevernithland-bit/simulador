<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>Simulador Maggi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Nunito Sans',system-ui,sans-serif;color:#0d2747;background:#05346C;
  background:radial-gradient(1100px 600px at 85% -10%,#1473E6 0%,transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(246,147,2,.35) 0%,transparent 60%),#05346C;
  display:flex;align-items:center;justify-content:center;padding:24px 16px}
.cx{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:34px 30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.marca{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #e8edf3}
.marca svg{height:38px;width:auto;display:block}
.marca span{font-size:11.5px;font-weight:800;color:#F69302;letter-spacing:1.6px;text-transform:uppercase}
h1{font-size:24px;font-weight:900;color:#05346C;line-height:1.2}
p.sub{font-size:14px;color:#5b6b80;margin:6px 0 22px}
label.c{display:block;font-size:12.5px;font-weight:800;color:#33465e;margin:0 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid #d4dce7;border-radius:12px;outline:none;transition:border-color .15s,box-shadow .15s;margin-bottom:14px}
input:focus{border-color:#1473E6;box-shadow:0 0 0 4px rgba(20,115,230,.15)}
.lem{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#33465e;margin:2px 0 18px;cursor:pointer;user-select:none}
.lem input{width:17px;height:17px;accent-color:#1473E6}
button{width:100%;font:inherit;font-size:16px;font-weight:900;color:#fff;background:#F69302;border:0;border-radius:12px;padding:14px;cursor:pointer;transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.06)}button:active{transform:scale(.99)}
button[disabled]{opacity:.7;cursor:wait}
.erro{min-height:20px;font-size:13.5px;font-weight:700;color:#c62828;margin-top:12px;text-align:center}
.pe{margin-top:16px;font-size:11.5px;color:#8a97a8;text-align:center}
.oculto{display:none}
.carr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;gap:12px}
.carr.on{display:flex}
.carr i{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>

(function(){
  var CH = 'msim_acesso', te = new TextEncoder(), S = window.crypto && crypto.subtle;
  var PEP = 'mg' + '7q' + 'Z2' + 'v9' + 'Rk' + 'x4' + 'Np';
  function b(x){ return Uint8Array.from(atob(x), function(c){ return c.charCodeAt(0); }); }
  function b64(u8){ var s=''; for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); }
  function norm(u){ return (u||'').trim().toLowerCase(); }
  function mem(){ try{ return JSON.parse(localStorage.getItem(CH)||'null'); }catch(e){ return null; } }
  function grava(v){ try{ v ? localStorage.setItem(CH, JSON.stringify(v)) : localStorage.removeItem(CH); }catch(e){} }
  function slotId(u){ return S.digest('SHA-256', te.encode('maggi-sim|'+norm(u))).then(function(h){ return hex(h).slice(0,16); }); }

    return S.importKey('raw', te.encode(norm(u)+'|'+senha), 'PBKDF2', false, ['deriveBits']).then(function(k){

    }).then(function(x){ return new Uint8Array(x); });

  function abrir(sid, bits){
    var sl = D.slots[sid];

      .then(function(wk){ return S.decrypt({name:'AES-GCM', iv:b(sl.iv)}, wk, b(sl.k)); })

  function conteudo(kr){

      .then(function(ck){ return S.decrypt({name:'AES-GCM', iv:b(D.iv)}, ck, b(D.ct)); })

    ev.preventDefault();
    var u = D.multi ? document.getElementById('u').value : '', senha = document.getElementById('s').value;

    }).catch(function(){
      bt.disabled = false; bt.textContent = 'Entrar';
      e.textContent = D.multi ? 'Usuário ou senha incorretos.' : 'Senha incorreta.';
